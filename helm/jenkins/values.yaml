jenkins:
  controller:
    image:
      registry: docker.io
      repository: bitnami/jenkins
      tag: 2.462.1-debian-12-r0  # Совместимо с K8s 1.34

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi

    ingress:
      enabled: true
      apiVersion: networking.k8s.io/v1  # ← ВАЖНО для K8s 1.29+
      hostname: jenkins.localhost
      annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      tls: true
      extraTls:
        - hosts:
            - jenkins.localhost
          secretName: jenkins-tls

    serviceType: ClusterIP

    admin:
      existingSecret: ""
      userKey: admin-user
      passwordKey: admin-password
    # Или явно:
    # adminUser: admin
    # adminPassword: changeme123

    installPlugins:
      - kubernetes:1.31.2
      - workflow-aggregator:590.v6a_d052384def
      - git:5.2.1
      - configuration-as-code:1775.v810dc9500f2a

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  rbac:
    create: true

  serviceAccount:
    create: true
