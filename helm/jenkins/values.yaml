jenkins:
  controller:
    ingress:
      enabled: true
      hostname: jenkins.localhost
      annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      tls: true
      extraTls:
        - hosts:
            - jenkins.localhost
          secretName: jenkins-tls
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi
    serviceType: ClusterIP
    adminUser: admin
    adminPassword: admin 
    installPlugins:
      - kubernetes:latest
      - workflow-aggregator:latest
      - git:latest

  persistence:
    enabled: true
    size: 10Gi

  rbac:
    create: true

