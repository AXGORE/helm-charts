global:
  domain: 192.168.49.2.nip.io  

server:

  service:
    type: NodePort
    nodePortHttp: 30080
    nodePortHttps: 30443
  

  ingress:
    enabled: true
    hosts:
      - argocd.localhost
    paths:
      - /
    tls:
      - secretName: argocd-server-tls
        hosts:
          - argocd.localhost


  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi


configs:
  params:
    server.insecure: "true"  
    controller.extraArgs:
      - --application-namespaces=*
    repo-server.extraArgs:
      - --parallelism=5

# Metrics для мониторинга
metrics:
  enabled: true
